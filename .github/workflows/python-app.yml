name: Python application

on:
  push:
    branches:
      - main
      - IntegrateTesting
  pull_request:
    branches:
      - main
      - IntegrateTesting

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
          python -m pip install flake8 pytest

      - name: Provide minimal closure.joblib for tests
        run: |
          python - <<'PY'
          from sklearn.gaussian_process import GaussianProcessRegressor
          from joblib import dump
          import os
          os.makedirs('Lorenz96', exist_ok=True)
          gp = GaussianProcessRegressor()
          dump(gp, 'Lorenz96/closure.joblib')
          print('Wrote Lorenz96/closure.joblib')
          PY

      - name: Lint with flake8 (syntax/import checks)
        run: |
          flake8 . --count --select=E9,F63,F7 --show-source --statistics

      - name: Lint with flake8 (full report)
        run: |
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Test with pytest
        run: |
          if find . -type f \( -name 'test_*.py' -o -name '*_test.py' \) | grep -q .; then
            pytest
          else
            echo "No pytest test files found; skipping pytest."
          fi
